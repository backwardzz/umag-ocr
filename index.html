<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4b45e0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234b45e0'/%3E%3Cpath d='M9 8h14v16H9z' fill='white'/%3E%3Cpath d='M12 12h8M12 16h8M12 20h5' stroke='%234b45e0' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Накладные в Sauda</title>
    <!-- тема до запуска приложения, чтобы страница не мигала белым (логика — src/app/theme.ts) -->
    <script>
      try {
        var t = localStorage.getItem('sauda.theme');
        document.documentElement.dataset.theme = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
